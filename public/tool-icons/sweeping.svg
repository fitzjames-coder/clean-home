<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8C070"/>
      <stop offset="50%"  stop-color="#C49A3C"/>
      <stop offset="100%" stop-color="#7D5A0D"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#6B4A08"/>
      <stop offset="100%" stop-color="#4A3205"/>
    </linearGradient>
    <linearGradient id="bristle-grd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E6B820"/>
      <stop offset="100%" stop-color="#A07818"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.22)"/>
    </filter>
  </defs>

  <!-- ── Handle (angled stick from top-right to binding area) ── -->
  <line x1="228" y1="24" x2="112" y2="160"
        stroke="url(#handle)" stroke-width="22" stroke-linecap="round"
        filter="url(#shadow)"/>
  <!-- highlight -->
  <line x1="226" y1="24" x2="110" y2="160"
        stroke="rgba(255,255,255,0.32)" stroke-width="7" stroke-linecap="round"/>
  <!-- wood grain -->
  <line x1="196" y1="56"  x2="208" y2="44"  stroke="rgba(90,55,5,0.40)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="172" y1="82"  x2="184" y2="70"  stroke="rgba(90,55,5,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="148" y1="108" x2="160" y2="96"  stroke="rgba(90,55,5,0.30)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── Ferrule / binding band ── -->
  <!-- Perpendicular to handle direction (~50° from vertical): use a rotated rect -->
  <rect x="94" y="153" width="36" height="16" rx="5"
        fill="url(#ferrule)"
        transform="rotate(-40 112 161)"
        filter="url(#shadow)"/>

  <!-- ── Bristle fan (9 lines from binding base downward) ── -->
  <!-- bristle base at approx (112, 168) after ferrule -->
  <g stroke-linecap="round">
    <line x1="112" y1="168" x2="42"  y2="248" stroke="#DAA520" stroke-width="11"/>
    <line x1="112" y1="168" x2="62"  y2="250" stroke="#C89010" stroke-width="11"/>
    <line x1="112" y1="168" x2="80"  y2="252" stroke="#E6B820" stroke-width="11"/>
    <line x1="112" y1="168" x2="99"  y2="253" stroke="#F0C840" stroke-width="11"/>
    <line x1="112" y1="168" x2="117" y2="254" stroke="#DAA520" stroke-width="11"/>
    <line x1="112" y1="168" x2="135" y2="253" stroke="#C89010" stroke-width="11"/>
    <line x1="112" y1="168" x2="152" y2="251" stroke="#E6B820" stroke-width="11"/>
    <line x1="112" y1="168" x2="168" y2="246" stroke="#C49A3C" stroke-width="11"/>
    <line x1="112" y1="168" x2="182" y2="240" stroke="#A07818" stroke-width="11"/>
  </g>
  <!-- bristle highlight overlay (lighter, thinner) -->
  <g stroke-linecap="round" opacity="0.35">
    <line x1="112" y1="168" x2="42"  y2="248" stroke="#FFF0A0" stroke-width="4"/>
    <line x1="112" y1="168" x2="99"  y2="253" stroke="#FFF0A0" stroke-width="4"/>
    <line x1="112" y1="168" x2="152" y2="251" stroke="#FFF0A0" stroke-width="4"/>
  </g>

  <!-- ── Dust particles ── -->
  <circle cx="24"  cy="232" r="9"  fill="#B0B8C4" opacity="0.85"/>
  <circle cx="16"  cy="250" r="7"  fill="#B0B8C4" opacity="0.75"/>
  <circle cx="38"  cy="248" r="6"  fill="#C8D0D8" opacity="0.70"/>
</svg>
