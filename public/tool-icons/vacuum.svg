<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2ECC8F"/>
      <stop offset="60%"  stop-color="#1ABC7A"/>
      <stop offset="100%" stop-color="#0E8A55"/>
    </linearGradient>
    <linearGradient id="head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>
    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5A6878"/>
      <stop offset="100%" stop-color="#3A4858"/>
    </linearGradient>
    <radialGradient id="btn-grad" cx="38%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A8D8C8"/>
    </radialGradient>
    <radialGradient id="wheel-grad" cx="35%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#6A7888"/>
      <stop offset="100%" stop-color="#2A3848"/>
    </radialGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="2" dy="5" stdDeviation="7" flood-color="rgba(0,0,0,0.28)"/>
    </filter>
  </defs>

  <!-- ── Handle (inverted-V arch at top) ── -->
  <!-- Horizontal grip bar -->
  <rect x="96" y="16" width="64" height="14" rx="7"
        fill="url(#handle-grad)" filter="url(#shadow)"/>
  <rect x="98" y="17" width="58" height="5" rx="3"
        fill="rgba(255,255,255,0.25)"/>
  <!-- Left strut -->
  <line x1="104" y1="30" x2="108" y2="50"
        stroke="#4A5568" stroke-width="13" stroke-linecap="round"/>
  <!-- Right strut -->
  <line x1="152" y1="30" x2="148" y2="50"
        stroke="#4A5568" stroke-width="13" stroke-linecap="round"/>

  <!-- ── Main body (tall rounded rect, teal) ── -->
  <rect x="98" y="46" width="60" height="128" rx="14"
        fill="url(#body-grad)" filter="url(#shadow)"/>
  <!-- Body highlight (left inner glow) -->
  <rect x="100" y="48" width="16" height="124" rx="8"
        fill="rgba(255,255,255,0.18)"/>
  <!-- Body detail line -->
  <line x1="98" y1="100" x2="158" y2="100"
        stroke="rgba(0,0,0,0.12)" stroke-width="2.5"/>
  <!-- Power button -->
  <circle cx="128" cy="80" r="14" fill="url(#btn-grad)" filter="url(#shadow)"/>
  <circle cx="128" cy="80" r="10" fill="rgba(14,138,85,0.35)"
          stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
  <!-- power symbol -->
  <path d="M 128 74 L 128 80" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 122 76 Q 118 80 122 84 Q 128 88 134 84 Q 138 80 134 76"
        stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Dust bin hatch lines on lower body -->
  <line x1="104" y1="130" x2="152" y2="130" stroke="rgba(0,0,0,0.10)" stroke-width="2"/>
  <line x1="104" y1="140" x2="152" y2="140" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
  <line x1="104" y1="150" x2="152" y2="150" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
  <line x1="104" y1="160" x2="152" y2="160" stroke="rgba(0,0,0,0.07)" stroke-width="2"/>

  <!-- ── Cleaning head (wide, dark) ── -->
  <rect x="64" y="174" width="128" height="36" rx="12"
        fill="url(#head-grad)" filter="url(#shadow)"/>
  <rect x="66" y="175" width="120" height="14" rx="8"
        fill="rgba(255,255,255,0.08)"/>
  <!-- brush roll line -->
  <line x1="70" y1="192" x2="186" y2="192"
        stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- suction vents -->
  <rect x="78"  y="185" width="6" height="12" rx="3" fill="rgba(0,0,0,0.20)"/>
  <rect x="94"  y="185" width="6" height="12" rx="3" fill="rgba(0,0,0,0.20)"/>
  <rect x="150" y="185" width="6" height="12" rx="3" fill="rgba(0,0,0,0.20)"/>
  <rect x="166" y="185" width="6" height="12" rx="3" fill="rgba(0,0,0,0.20)"/>

  <!-- ── Wheels ── -->
  <circle cx="86"  cy="218" r="15" fill="url(#wheel-grad)" filter="url(#shadow)"/>
  <circle cx="84"  cy="215" r="5"  fill="rgba(255,255,255,0.22)"/>
  <circle cx="170" cy="218" r="15" fill="url(#wheel-grad)" filter="url(#shadow)"/>
  <circle cx="168" cy="215" r="5"  fill="rgba(255,255,255,0.22)"/>

  <!-- Axle connector -->
  <line x1="101" y1="218" x2="155" y2="218"
        stroke="#3A4858" stroke-width="6" stroke-linecap="round"/>
</svg>
